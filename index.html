<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For Samavvia ❤️</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      overflow: hidden;
      flex-direction: column;
    }

    .card {
      background: white;
      padding: 40px 30px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      max-width: 400px;
      width: 90%;
      position: relative;
    }

    h1 { font-size: 26px; margin-bottom: 10px; color: #ff4b6e; }
    h2 { font-size: 18px; color: #888; margin-bottom: 15px; }

    .buttons { display: flex; justify-content: center; gap: 15px; margin-top: 20px; }

    button {
      border: none; padding: 12px 18px; border-radius: 30px; font-size: 16px; cursor: pointer; transition: 0.3s ease; position: relative;
    }

    .yes { background: #ff4b6e; color: white; }
    .yes:hover { transform: scale(1.1); background: #ff2e56; }

    .no { background: #eee; position: absolute; }

    .message { margin-top: 20px; font-size: 18px; color: #ff4b6e; display: none; }

    .heart { position: absolute; font-size: 20px; animation: float 4s linear infinite; opacity: 0.7; }

    @keyframes float {
      0% { transform: translateY(0) scale(1); opacity: 1; }
      100% { transform: translateY(-600px) scale(1.5); opacity: 0; }
    }

    .letter {
      display: none;
      max-width: 500px;
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      text-align: center;
      line-height: 1.6;
      font-size: 18px;
      min-height: 220px;
    }

    .cursor {
      display: inline-block;
      width: 2px;
      background: #ff4b6e;
      animation: blink 1s infinite;
      margin-left: 3px;
      height: 20px;
      vertical-align: bottom;
    }

    @keyframes blink {
      0%, 50%, 100% { opacity: 1; }
      25%, 75% { opacity: 0; }
    }
  </style>
</head>
<body>

  <audio id="music" loop>
    <source src="perfect.mp3" type="audio/mpeg">
  </audio>

  <div class="card" id="mainCard">
    <h1>Samavvia, will you be my Valentine? 💖</h1>
    <h2>Every second with you is magic ✨</h2>

    <div class="buttons">
      <button class="yes" onclick="sayYes()">Absolutely Yes 💘</button>
      <button class="no" id="noBtn">No 🙈</button>
    </div>

    <div class="message" id="message">Yayyyy!!! You just made me the happiest person alive 💕</div>
  </div>

  <div class="letter" id="letter">
    <span id="typedText"></span><span class="cursor"></span>
  </div>

  <script>
    const noBtn = document.getElementById('noBtn');
    const message = document.getElementById('message');
    const letter = document.getElementById('letter');
    const mainCard = document.getElementById('mainCard');
    const music = document.getElementById('music');
    const typedText = document.getElementById('typedText');

    const loveMessage = `My Dearest Samavvia ❤️\n\nFrom the moment you came into my life, everything became brighter, softer, and more meaningful. Your smile is my favorite sight, your voice is my favorite sound, and your happiness is my biggest dream.\n\nI promise to stand beside you, support you, annoy you a little 😄, and love you more with every passing day. You are not just my Valentine… you are my heart, my peace, and my forever.\n\nI love you endlessly. 💖`;

    function typeLetter(text, i = 0) {
      if (i < text.length) {
        typedText.innerHTML += text[i] === '\n' ? '<br>' : text[i];
        setTimeout(() => typeLetter(text, i + 1), 35);
      }
    }

    function moveNoButton() {
      const x = Math.random() * (window.innerWidth - 120);
      const y = Math.random() * (window.innerHeight - 60);
      noBtn.style.left = x + 'px';
      noBtn.style.top = y + 'px';
    }

    noBtn.addEventListener('mouseenter', moveNoButton);
    noBtn.addEventListener('click', moveNoButton);

    function sayYes() {
      message.style.display = 'block';
      music.play().catch(() => {});
      createHearts();

      setTimeout(() => {
        mainCard.style.display = 'none';
        letter.style.display = 'block';
        typeLetter(loveMessage);
      }, 2000);
    }

    function createHearts() {
      for (let i = 0; i < 25; i++) {
        const heart = document.createElement('div');
        heart.className = 'heart';
        heart.innerText = '💖';
        heart.style.left = Math.random() * 100 + 'vw';
        heart.style.bottom = '0';
        heart.style.animationDuration = (2 + Math.random() * 3) + 's';
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 5000);
      }
    }

    moveNoButton();
  </script>
</body>
</html>
